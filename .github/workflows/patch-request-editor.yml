name: Temporary request editor patch

on:
  push:
    branches:
      - fix/core-clinical-workflow
    paths:
      - .github/workflows/patch-request-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-clinical-workflow
          fetch-depth: 0
      - name: Apply focused RequestEditor updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/requests/RequestEditor.tsx')
          text = path.read_text()

          old_import = 'import { resolveTemplateSelection } from "@/lib/templates/compatibility";\n'
          new_import = old_import + 'import { maskCpf } from "@/lib/personal-data";\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          old_stepper = '''          {STEPS.map((label, index) => (\n            <li key={label} className="flex items-center gap-2">\n              <button\n                type="button"\n                onClick={() => setStep(index)}\n                aria-current={index === step ? "step" : undefined}\n                aria-label={`Etapa ${index + 1}: ${label}`}\n                className={`flex size-5 items-center justify-center rounded-full text-[10px] font-bold ${\n                  index === step ? "bg-[#1e5fa6] text-white" : index < step ? "bg-[#16a34a] text-white" : "bg-[#f1f5f9] text-[#475569]"\n                }`}\n              >\n                {index + 1}\n              </button>\n              <span className={`text-[12px] ${index === step ? "font-semibold text-[#1e5fa6]" : "text-[#475569]"}`}>\n                {label}\n              </span>\n            </li>\n          ))}\n'''
          new_stepper = '''          {STEPS.map((label, index) => (\n            <li key={label} className="flex items-center gap-2">\n              {index > 0 ? <span aria-hidden="true" className="text-[13px] text-[#cbd5e1]">›</span> : null}\n              <button\n                type="button"\n                onClick={() => setStep(index)}\n                aria-current={index === step ? "step" : undefined}\n                aria-label={`Etapa ${index + 1}: ${label}`}\n                className={`flex size-5 items-center justify-center rounded-full text-[10px] font-bold ${\n                  index === step ? "bg-[#1e5fa6] text-white" : index < step ? "bg-[#16a34a] text-white" : "bg-[#f1f5f9] text-[#475569]"\n                }`}\n              >\n                {index + 1}\n              </button>\n              <span className={`text-[12px] ${index === step ? "font-semibold text-[#1e5fa6]" : "text-[#475569]"}`}>\n                {label}\n              </span>\n            </li>\n          ))}\n'''
          assert text.count(old_stepper) == 1
          text = text.replace(old_stepper, new_stepper, 1)

          old_search_cpf = '<span className="text-[#64748b]">{p.cpf ?? "sem CPF"}</span>'
          new_search_cpf = '<span className="text-[#64748b]">{p.cpf ? maskCpf(p.cpf) : "sem CPF"}</span>'
          assert text.count(old_search_cpf) == 1
          text = text.replace(old_search_cpf, new_search_cpf, 1)

          old_selected_cpf = 'Nascimento: {selectedPatient?.birthDate ?? "—"} • CPF: {selectedPatient?.cpf ?? "—"}'
          new_selected_cpf = 'Nascimento: {selectedPatient?.birthDate ?? "—"} • CPF: {selectedPatient?.cpf ? maskCpf(selectedPatient.cpf) : "—"}'
          assert text.count(old_selected_cpf) == 1
          text = text.replace(old_selected_cpf, new_selected_cpf, 1)

          old_proc_open = '''      {step === 2 ? (\n        <Card>\n          <div className="mb-4 flex flex-wrap items-center justify-between gap-3">\n'''
          new_proc_open = '''      {step === 2 ? (\n        <div className="flex flex-col gap-4">\n          <section aria-labelledby="clinical-context-title" className="rounded-xl border border-[#dbeafe] bg-[#f8fbff] px-4 py-3">\n            <div className="flex flex-wrap items-start justify-between gap-3">\n              <div className="min-w-0 flex-1">\n                <p id="clinical-context-title" className="text-[11px] font-semibold uppercase tracking-wide text-[#64748b]">Contexto clínico</p>\n                <p className="mt-1 text-[13px] text-[#0f172a]">\n                  <span className="font-semibold">Diagnóstico:</span> {request.diagnosis?.trim() || "Não informado"}\n                </p>\n                <div className="mt-2 flex flex-wrap gap-2" aria-label="CID selecionados">\n                  {request.cids.length > 0 ? request.cids.map((cid) => (\n                    <span key={cid.id} className="rounded-full bg-[#eff6ff] px-2.5 py-1 text-[11px] font-medium text-[#1e5fa6]">\n                      CID {cid.codeSnapshot} — {cid.descriptionSnapshot}\n                    </span>\n                  )) : <span className="text-[12px] text-[#b45309]">Nenhum CID selecionado.</span>}\n                </div>\n              </div>\n              <button type="button" className="text-[12px] font-semibold text-[#1e5fa6] hover:underline" onClick={() => setStep(1)}>\n                Editar diagnóstico\n              </button>\n            </div>\n          </section>\n          <Card>\n          <div className="mb-4 flex flex-wrap items-center justify-between gap-3">\n'''
          assert text.count(old_proc_open) == 1
          text = text.replace(old_proc_open, new_proc_open, 1)

          old_proc_close = '''          </div>\n        </Card>\n      ) : null}\n\n      {step === 3 ? (\n'''
          new_proc_close = '''          </div>\n          </Card>\n        </div>\n      ) : null}\n\n      {step === 3 ? (\n'''
          assert text.count(old_proc_close) == 1
          text = text.replace(old_proc_close, new_proc_close, 1)

          path.write_text(text)
          PY
      - name: Commit focused editor update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/requests/RequestEditor.tsx
          git diff --cached --check
          git commit -m "ui: keep clinical context visible during procedure selection"
          git push origin HEAD:fix/core-clinical-workflow
