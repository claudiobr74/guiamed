name: Apply procedure table selector

on:
  push:
    branches:
      - simplify/lizacare-baseline
    paths:
      - ".github/workflows/apply-table-selector.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused NewRequest patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/newrequest.patch
          patch -p1 < /tmp/newrequest.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NewRequest.tsx
          git commit -m "fix: select procedure table per request"
          git push origin HEAD
