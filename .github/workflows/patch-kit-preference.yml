name: One-shot kit preference patch

on:
  push:
    branches:
      - fix/core-clinical-workflow
    paths:
      - .github/workflows/patch-kit-preference.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-clinical-workflow
          fetch-depth: 0
      - name: Patch RequestEditor kit resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/requests/RequestEditor.tsx')
          text = path.read_text()

          old_import = 'import { quantityForCodes, resolveProcedureCode } from "@/lib/codes";\n'
          new_import = old_import + 'import { resolveKitItemCodes } from "@/lib/kits/resolve-kit-codes";\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          old_block = '          const procedure = kitProcedureById.get(item.procedureId);\n          if (!procedure) throw new Error("Procedimento do kit não localizado na base.");\n          const tuss = resolveProcedureCode(procedure.codes, { procedureId: procedure.id, codeSystem: "TUSS", at: resolutionDate, healthInsurerId: request.healthInsurerId });\n          const ipasgo = resolveProcedureCode(procedure.codes, { procedureId: procedure.id, codeSystem: "IPASGO", at: resolutionDate, healthInsurerId: request.healthInsurerId });\n          return {\n'
          new_block = '          const procedure = kitProcedureById.get(item.procedureId);\n          if (!procedure) throw new Error("Procedimento do kit não localizado na base.");\n          const { tuss, ipasgo } = resolveKitItemCodes({\n            procedure,\n            item,\n            healthInsurerId: request.healthInsurerId,\n            at: resolutionDate,\n          });\n          return {\n'
          assert text.count(old_block) == 1
          text = text.replace(old_block, new_block, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/requests/RequestEditor.tsx
          git diff --cached --check
          git commit -m "fix: honor preferred code when applying kits"
          git push origin HEAD:fix/core-clinical-workflow
