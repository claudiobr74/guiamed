name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          PDF_FIXTURE_OUTPUT_DIR: artifacts/pdf-fixtures
      - name: Publish synthetic PDF fixtures
        uses: actions/upload-artifact@v4
        with:
          name: pdf-fixtures-${{ github.event.pull_request.number || github.sha }}
          path: artifacts/pdf-fixtures
          if-no-files-found: error
          retention-days: 14
      - run: pnpm build
        env:
          SESSION_SECRET: ci-session-secret
