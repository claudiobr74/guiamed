name: Apply procedure table selector v2

on:
  push:
    branches:
      - simplify/lizacare-baseline
    paths:
      - ".github/workflows/apply-table-selector-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused NewRequest patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          workflow = Path('.github/workflows/apply-table-selector.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d", workflow)
          if not match:
              raise SystemExit('Patch payload not found')
          Path('/tmp/newrequest.patch').write_bytes(base64.b64decode(match.group(1)))
          PY
          patch -p1 < /tmp/newrequest.patch
          sed -i 's/[[:space:]]\+$//' src/pages/NewRequest.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NewRequest.tsx
          git commit -m "fix: select procedure table per request"
          git push origin HEAD
