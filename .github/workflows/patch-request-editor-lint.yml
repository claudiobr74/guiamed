name: Patch RequestEditor lint

on:
  push:
    branches:
      - fix/core-clinical-workflow
    paths:
      - .github/workflows/patch-request-editor-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-clinical-workflow
          fetch-depth: 0
      - name: Remove redundant synchronous state update
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/features/requests/RequestEditor.tsx")
          text = path.read_text()
          old = '''    if (!request.tussTableKey || query.length < MIN_SEARCH_LENGTH) {\n      setProcResults([]);\n      return;\n    }'''
          new = '''    if (!request.tussTableKey || query.length < MIN_SEARCH_LENGTH) return;'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one effect guard, found {count}")
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Claudio Marcio Macedo"
          git config user.email "Claudiomacedo74@yahoo.com.br"
          git add src/features/requests/RequestEditor.tsx
          git commit -m "fix: avoid synchronous search state update"
          git push origin HEAD:fix/core-clinical-workflow
