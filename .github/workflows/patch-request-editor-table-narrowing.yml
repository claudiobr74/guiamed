name: Patch RequestEditor table narrowing

on:
  push:
    branches:
      - fix/core-clinical-workflow
    paths:
      - .github/workflows/patch-request-editor-table-narrowing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-clinical-workflow
          fetch-depth: 0
      - name: Capture validated table key before kit callback
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/features/requests/RequestEditor.tsx")
          text = path.read_text()
          old = '''      onSelect={(kit) => {\n        if (!request.tussTableKey) {\n          setSaveState("error");\n          setSaveError("Selecione a Tabela TUSS antes de aplicar um kit.");\n          return;\n        }\n        const missingProcedure = kit.items.find((item) => !kitProcedureById.has(item.procedureId));'''
          new = '''      onSelect={(kit) => {\n        const tableKey = request.tussTableKey;\n        if (!tableKey) {\n          setSaveState("error");\n          setSaveError("Selecione a Tabela TUSS antes de aplicar um kit.");\n          return;\n        }\n        const missingProcedure = kit.items.find((item) => !kitProcedureById.has(item.procedureId));'''
          if text.count(old) != 1:
              raise SystemExit(f"kit guard occurrence count: {text.count(old)}")
          text = text.replace(old, new, 1)
          old_block = '''          const tuss = resolveKitItemTussCode({\n            procedure,\n            item,\n            healthInsurerId: request.healthInsurerId,\n            tableKey: request.tussTableKey,\n            at: resolutionDate,\n          });'''
          new_block = '''          const tuss = resolveKitItemTussCode({\n            procedure,\n            item,\n            healthInsurerId: request.healthInsurerId,\n            tableKey,\n            at: resolutionDate,\n          });'''
          if text.count(old_block) != 1:
              raise SystemExit(f"kit resolver block count: {text.count(old_block)}")
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Claudio Marcio Macedo"
          git config user.email "Claudiomacedo74@yahoo.com.br"
          git add src/features/requests/RequestEditor.tsx
          git commit -m "fix: preserve selected TUSS table in kit callback"
          git push origin HEAD:fix/core-clinical-workflow

# one-shot workflow: remove after successful patch
